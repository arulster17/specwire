name: tests

on:
  push:
    branches: [main]
  pull_request:

# CPU-only torch: the locked CUDA build is several GB and these runners have no GPU.
# Installing it first means the project install below finds torch already satisfied.
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . pytest
      - run: uv run --no-sync pytest -q tests/test_verify.py tests/test_proto.py tests/test_bench.py tests/test_cloud.py

  # Speculative output must equal the target model's own, token for token, in eager
  # mode, fast mode and over gRPC. Downloads Qwen2.5 0.5B and 1.5B and runs them in fp32.
  exactness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-qwen2.5-0.5b-1.5b
      - run: uv venv --python 3.12
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . pytest
      - run: uv run --no-sync pytest -q tests/test_equivalence.py tests/test_fast.py tests/test_rpc.py
