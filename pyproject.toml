[project]
name = "specwire"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
