[project]
name = "specwire"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
    "rich>=15.0.0",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

# CUDA torch on Windows/Linux; macOS keeps the default PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
