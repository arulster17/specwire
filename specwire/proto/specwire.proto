// Regenerate from repo root: uv run python -m grpc_tools.protoc -I. --python_out=. --pyi_out=. --grpc_python_out=. specwire/proto/specwire.proto
syntax = "proto3";
package specwire;

service Draft {
  rpc Propose(ProposeRequest) returns (ProposeReply);
}
message ProposeRequest {
  int32 keep_len = 1;              // cached tokens to keep; 0 starts fresh
  repeated int32 new_tokens = 2;   // token ids to process after the kept ones
  int32 k = 3;                     // number of tokens to draft
}
message ProposeReply {
  repeated int32 tokens = 1;
}

service Target {
  rpc Verify(VerifyRequest) returns (VerifyReply);
}
message VerifyRequest {
  int32 keep_len = 1;              // cached tokens to keep; 0 starts fresh
  repeated int32 new_tokens = 2;   // token ids to process after the kept ones
  repeated int32 draft = 3;
}
message VerifyReply {
  int32 num_accepted = 1;
  int32 next_token = 2;        // target's token after the accepted prefix
  repeated int32 target_choices = 3;  // target's argmax at each of the k+1 spots
}
